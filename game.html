<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catch the Stars — built from one prompt</title>
<style>
  html, body { margin: 0; padding: 0; background: #05070f; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
  #wrap { position: relative; height: 100vh; aspect-ratio: 9 / 16; max-width: 100vw; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
  #hint {
    position: absolute; left: 0; right: 0; bottom: 18px; text-align: center;
    color: #9fb2ff; font-size: 14px; letter-spacing: 1px; pointer-events: none;
    text-shadow: 0 1px 4px #000;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1080" height="1920"></canvas>
  <div id="hint">◀ ▶ arrow keys or drag &nbsp;·&nbsp; catch the falling stars</div>
</div>
<script type="module">
import { W, H, createGame, stepGame, autoMove, resetGame, drawGame } from './game.js';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// Minimal raster the shared core draws through, backed by canvas 2d.
const FONT = {
  '0': [0x3E,0x51,0x49,0x45,0x3E], '1': [0x00,0x42,0x7F,0x40,0x00],
  '2': [0x42,0x61,0x51,0x49,0x46], '3': [0x21,0x41,0x45,0x4B,0x31],
  '4': [0x18,0x14,0x12,0x7F,0x10], '5': [0x27,0x45,0x45,0x45,0x39],
  '6': [0x3C,0x4A,0x49,0x49,0x30], '7': [0x01,0x71,0x09,0x05,0x03],
  '8': [0x36,0x49,0x49,0x49,0x36], '9': [0x06,0x49,0x49,0x29,0x1E],
  ' ': [0,0,0,0,0],
  'A': [0x7E,0x11,0x11,0x11,0x7E], 'C': [0x3E,0x41,0x41,0x41,0x22],
  'E': [0x7F,0x49,0x49,0x49,0x41], 'G': [0x3E,0x41,0x49,0x49,0x3A],
  'H': [0x7F,0x08,0x08,0x08,0x7F], 'I': [0x00,0x41,0x7F,0x41,0x00],
  'L': [0x7F,0x40,0x40,0x40,0x40], 'M': [0x7F,0x02,0x0C,0x02,0x7F],
  'O': [0x3E,0x41,0x41,0x41,0x3E], 'R': [0x7F,0x09,0x19,0x29,0x46],
  'S': [0x46,0x49,0x49,0x49,0x31], 'T': [0x01,0x01,0x7F,0x01,0x01],
  'V': [0x3F,0x20,0x10,0x20,0x3F],
};
function drawText(str, x, y, scale, color) {
  ctx.fillStyle = color;
  let cx = x;
  for (const ch of str.toUpperCase()) {
    const cols = FONT[ch] || FONT[' '];
    for (let c = 0; c < 5; c++) {
      for (let row = 0; row < 7; row++) {
        // Glyph bytes are columns, bit 0 (LSB) is the top row.
        if (cols[c] & (1 << row)) ctx.fillRect(cx + c * scale, y + row * scale, scale, scale);
      }
    }
    cx += 6 * scale;
  }
}
function drawStar(x, y, size, rot, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 === 0 ? size : size * 0.45;
    const a = rot + (i * Math.PI) / 5 - Math.PI / 2;
    const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
}
const raster = {
  rect(x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(x, y, w, h); },
  circle(x, y, rad, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.fill(); },
  star(x, y, size, rot, color) { drawStar(x, y, size, rot, color); },
  text(str, x, y, scale, color) { drawText(str, x, y, scale, color); },
};

const game = createGame(20261122);
let move = 0;
let pointerX = null;
let last = performance.now();

addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') move = -1;
  if (e.key === 'ArrowRight') move = 1;
  if (game.over && (e.key === ' ' || e.key === 'Enter')) resetGame(game);
});
addEventListener('keyup', (e) => {
  if ((e.key === 'ArrowLeft' && move === -1) || (e.key === 'ArrowRight' && move === 1)) move = 0;
});
function pointerToX(e) {
  const r = canvas.getBoundingClientRect();
  return ((e.clientX - r.left) / r.width) * W;
}
canvas.addEventListener('pointerdown', (e) => { pointerX = pointerToX(e); canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', (e) => { if (pointerX !== null) pointerX = pointerToX(e); });
canvas.addEventListener('pointerup', () => { pointerX = null; });
canvas.addEventListener('click', () => { if (game.over && game.overIn > 0.6) resetGame(game); });

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const m = pointerX !== null ? pointerX : move;
  stepGame(game, dt, m);
  if (game.over) game.overIn += dt;
  drawGame(game, raster);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
